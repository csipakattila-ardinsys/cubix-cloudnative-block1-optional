name: run integration tests, build jar, create and publish docker image
on:
  push:
    branches:
      - main
      - ci/**
jobs:
  maven-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        cache: 'maven'      
    - name: Maven verify
      run: mvn --batch-mode verify
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Upload artifact for Docker job
      uses: actions/upload-artifact@v6
      with:
        name: java-app
        path: '${{ github.workspace }}/target/*.jar'
  docker-publish:
    runs-on: ubuntu-latest
    needs: maven-verify
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
    - name: Download artifact from Maven job
      uses: actions/download-artifact@v6
      with:
        name: java-app
    - name: Logging in to Docker
      run: docker login ghcr.io -u csipakattila-ardinsys -p ${{ github.token }}
    - name: Build the Docker image
      run: docker build . --tag ghcr.io/csipakattila-ardinsys/cubix/1/optional/app:springboot
    - name: Publishing the Docker image
      run: docker push ghcr.io/csipakattila-ardinsys/cubix/1/optional/app:springboot
